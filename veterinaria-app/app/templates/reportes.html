<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte Veterinaria</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #eef2f7, #d9e7ff);
            min-height:100vh;
            padding:30px;
            color:#333;
        }

        .container{
            max-width:1200px;
            margin:auto;
        }

        .title{
            text-align:center;
            margin-bottom:30px;
        }

        .title h1{
            font-size:40px;
            color:#1e3a8a;
            margin-bottom:10px;
        }

        .title p{
            color:#555;
            font-size:16px;
        }

        .dashboard{
            display:grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap:25px;
        }

        .card{
            background:white;
            border-radius:20px;
            padding:25px;
            box-shadow:0 10px 25px rgba(0,0,0,0.08);
            transition:0.3s;
        }

        .card:hover{
            transform:translateY(-5px);
            box-shadow:0 15px 35px rgba(0,0,0,0.12);
        }

        .card h2{
            color:#1e40af;
            margin-bottom:20px;
            font-size:24px;
        }

        .total-box{
            text-align:center;
            padding:20px;
        }

        .total-number{
            font-size:60px;
            font-weight:bold;
            color:#2563eb;
            margin-top:10px;
        }

        ul{
            list-style:none;
        }

        li{
            background:#f3f6fb;
            margin-bottom:12px;
            padding:15px;
            border-radius:12px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            transition:0.3s;
            border-left:5px solid #2563eb;
        }

        li:hover{
            background:#e8f0ff;
            transform:scale(1.02);
        }

        .vet-name{
            font-weight:600;
        }

        .badge{
            background:#2563eb;
            color:white;
            padding:8px 14px;
            border-radius:20px;
            font-size:14px;
        }

        .chart-container{
            margin-top:20px;
            height:400px;
        }

        @media(max-width:768px){
            .title h1{
                font-size:30px;
            }

            .total-number{
                font-size:45px;
            }
        }
    </style>
</head>
<body>

<div class="container">

    <div class="title">
        <h1>🐾 Reporte Veterinaria</h1>
        <p>Sistema moderno de visualización de consultas veterinarias</p>
    </div>

    <div class="dashboard">

        <div class="card total-box">
            <h2>Total de Consultas</h2>
            <div class="total-number">
                {{ total_consultas }}
            </div>
        </div>

        <div class="card">
            <h2>👨‍⚕️ Consultas por Veterinario</h2>

            <ul>
                {% for item in consultas_por_veterinario %}
                    <li>
                        <span class="vet-name">{{ item[0] }}</span>
                        <span class="badge">{{ item[1] }} consultas</span>
                    </li>
                {% endfor %}
            </ul>
        </div>

    </div>

    <div class="card" style="margin-top:25px;">
        <h2>📊 Estadísticas Generales</h2>

        <div class="chart-container">
            <canvas id="grafica"></canvas>
        </div>
    </div>

</div>

<script>
window.onload = function() {

    const ctx = document.getElementById('grafica');

    const labels = {{ consultas_por_veterinario | map(attribute=0) | list | tojson }};
    const data = {{ consultas_por_veterinario | map(attribute=1) | list | tojson }};

    new Chart(ctx, {
        type: 'bar',
        data: {
            labels: labels,
            datasets: [{
                label: 'Consultas por veterinario',
                data: data,
                backgroundColor: [
                    '#2563eb',
                    '#3b82f6',
                    '#60a5fa',
                    '#93c5fd',
                    '#1d4ed8'
                ],
                borderRadius: 10,
                borderWidth: 1
            }]
        },
        options: {
            responsive:true,
            plugins:{
                legend:{
                    labels:{
                        font:{
                            size:14
                        }
                    }
                }
            },
            scales: {
                y: {
                    beginAtZero: true,
                    ticks:{
                        font:{
                            size:13
                        }
                    }
                },
                x:{
                    ticks:{
                        font:{
                            size:13
                        }
                    }
                }
            }
        }
    });
}
</script>

</body>
</html>
